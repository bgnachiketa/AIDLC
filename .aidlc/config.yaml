    typecheck:
      command: npm
      args:
        - run
        - typecheck
      cwd: .
      source: package.json scripts.typecheck
    test:
      command: npm
      args:
        - run
        - test
      cwd: .
      source: package.json scripts.test
    integration: null
    e2e: null
    build:
      command: npm
      args:
        - run
        - build
      cwd: .
      source: package.json scripts.build
    security: null
