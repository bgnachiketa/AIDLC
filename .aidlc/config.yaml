    typecheck:
      command: npm
      args:
        - run
        - typecheck
      cwd: packages/aidlc
      source: package.json scripts.typecheck
    test:
      command: npm
      args:
        - run
        - test
      cwd: packages/aidlc
      source: package.json scripts.test
    integration: null
    e2e: null
    build:
      command: npm
      args:
        - run
        - build
      cwd: packages/aidlc
      source: package.json scripts.build
