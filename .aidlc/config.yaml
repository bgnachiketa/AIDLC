    format: null
    lint:
      command: npm
      args:
        - run
        - lint
      cwd: extensions/vscode
      source: package.json scripts.lint
    typecheck:
      command: npm
      args:
        - run
        - typecheck
      cwd: extensions/vscode
      source: package.json scripts.typecheck
    test:
      command: npm
      args:
        - run
        - test
      cwd: extensions/vscode
      source: package.json scripts.test
    integration: null
