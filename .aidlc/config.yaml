conventions:
  baseBranch: main
  branchPattern: "{type}/{planId}-{slug}"
  commitStyle: conventional
qualityGates:
  required:
    - test
  optional:
    - lint
    - typecheck
    - build
integrations:
  claude: true
  codex: true
  cursor: true
  vscode: true
  gitHost: github
plans:
  directory: .aidlc/plans
  activePointer: .aidlc/state/active-plan.json
policy:
  fileChanges: prompt
  shell: prompt
  commit: prompt
  network: prompt
  pullRequest: prompt
  allowDestructive: false
  allowFailedGateCommit: false
ignore: []
